name: ci

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script:
    name: shellcheck + behaviour tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning diskwarden test/*.sh
      - name: behaviour tests
        run: bash test/run-tests.sh

  role:
    name: ansible role
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet ansible-core ansible-lint
      - name: syntax
        run: ansible-playbook --syntax-check ansible/playbook.example.yml
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
      # A gate, not advice. The profile is pinned in .ansible-lint so a new
      # ansible-lint release cannot make this pass by lowering the bar.
      - name: lint
        run: ansible-lint ansible/
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
      - name: role tests
        run: bash test/run-ansible-tests.sh

  backlog:
    name: backlog and roadmap in step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      # BACKLOG.md is the source; ROADMAP.md is generated from it. This fails
      # when they have drifted, which is the only way a generated file stays
      # generated.
      - run: npx --yes @allan_nava/backlogsync check

  page:
    name: the page matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet ansible-core
      # Building it is the check: the generator reads the defaults out of the
      # script and runs the suites, so it fails if either has drifted.
      - run: python3 docs/build.py
