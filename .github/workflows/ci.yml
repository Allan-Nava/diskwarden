name: ci

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: shellcheck + behaviour tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S warning diskwarden test/run-tests.sh
      - name: behaviour tests
        run: bash test/run-tests.sh
