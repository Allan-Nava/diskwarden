name: Backlog issues

# Keep the GitHub issues in step with BACKLOG.md.
#
# BACKLOG.md is the single source of truth, the same way it is for ROADMAP.md:
# an item's stable DW-n id is what commits and the release notes reference, and
# the issue is a view of it. The sync runs one way only — backlog to issues,
# never the reverse. Closing an issue on GitHub does not change the plan;
# ticking the item in BACKLOG.md does.

on:
  push:
    branches: [main]
    paths:
      - BACKLOG.md
      - .github/workflows/backlog-issues.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan without changing anything"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  # Two runs racing would both see "no issue for DW-n" and open it twice.
  group: backlog-issues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      # It prints the whole plan before applying anything, so the log says what
      # it was about to do even if a write fails.
      - uses: Allan-Nava/backlogsync@backlogsync--v0.1.1
        with:
          command: sync
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}
